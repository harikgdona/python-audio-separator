<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Karaoke Pipeline</title>
<style>
:root{
  --bg:#07070f;--panel:#0e0e1a;--border:#1a1a2e;
  --purple:#7c3aed;--cyan:#06b6d4;--green:#10b981;
  --red:#ef4444;--amber:#f59e0b;--pink:#ec4899;
  --text:#e2e8f0;--muted:#4a5568;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',monospace;min-height:100vh;overflow-x:hidden}

/* HEADER */
header{
  display:flex;align-items:center;gap:14px;
  padding:16px 28px;
  background:linear-gradient(90deg,#09091a,#150a2a);
  border-bottom:1px solid var(--border);
}
header h1{font-size:1.1rem;letter-spacing:3px;color:var(--cyan);text-transform:uppercase}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);margin-left:auto;transition:all .3s}
.dot.on{background:var(--green);box-shadow:0 0 10px var(--green);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* LAYOUT */
.layout{display:grid;grid-template-columns:260px 1fr;gap:16px;padding:20px 28px;max-width:1600px;margin:0 auto}

/* LEFT PANEL */
.left{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
.card-title{font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
label{display:block;font-size:.7rem;color:var(--muted);margin-bottom:5px;letter-spacing:1px;text-transform:uppercase}
select{width:100%;padding:9px 11px;background:#0a0a16;border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:.82rem;outline:none}
select:focus{border-color:var(--purple)}
.field{margin-bottom:13px}

/* GENDER TOGGLE */
.tog{display:flex;gap:7px;margin-bottom:14px}
.tog-btn{flex:1;padding:9px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;font-size:.82rem;transition:all .2s}
.tog-btn.on{background:var(--purple);border-color:var(--purple);color:#fff}
.tog-btn.female.on{background:var(--pink);border-color:var(--pink)}

/* RUN BUTTON */
#runBtn{
  width:100%;padding:13px;border:none;border-radius:9px;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  color:#fff;font-size:.88rem;font-weight:700;letter-spacing:1px;
  cursor:pointer;text-transform:uppercase;transition:opacity .2s
}
#runBtn:disabled{opacity:.35;cursor:not-allowed}

/* STAGES */
.stages{display:flex;flex-direction:column;gap:8px}
.stage{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:7px;
  border:1px solid var(--border);background:#0a0a16;
  font-size:.76rem;color:var(--muted);transition:all .3s
}
.stage.active{border-color:var(--cyan);color:var(--cyan);background:rgba(6,182,212,.06)}
.stage.done{border-color:var(--green);color:var(--green);background:rgba(16,185,129,.06)}
.stage.err{border-color:var(--red);color:var(--red)}
.stage-ico{font-size:.95rem;width:18px;text-align:center}

/* RIGHT */
.right{display:flex;flex-direction:column;gap:14px;min-width:0}

/* STEM TRACKS */
.tracks-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
.tracks-title{font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.track{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.track-label{width:68px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;flex-shrink:0}
.track-label.vocals{color:var(--cyan)}
.track-label.drums{color:var(--amber)}
.track-label.bass{color:var(--purple)}
.track-label.guitar{color:var(--green)}
.track-label.piano{color:var(--pink)}
.track-label.other{color:#94a3b8}
.track-canvas-wrap{flex:1;position:relative;height:54px;background:#080810;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
canvas.track-canvas{width:100%;height:100%;display:block}
.track-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--muted)}

/* LEGEND */
.legend{display:flex;gap:14px;margin-top:6px;margin-bottom:2px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:.7rem;color:var(--muted)}
.leg-dot{width:10px;height:10px;border-radius:2px}

/* OUTPUT PLAYER */
.player-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
.player-title{font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
#outputCanvas{width:100%;height:60px;background:#080810;border-radius:6px;border:1px solid var(--border);display:block}
.player-controls{display:flex;gap:8px;margin-top:10px;align-items:center}
.p-btn{padding:7px 16px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--text);cursor:pointer;font-size:.78rem;transition:all .2s}
.p-btn:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}
.p-btn:disabled{opacity:.3;cursor:not-allowed}
#timer{margin-left:auto;font-size:.75rem;color:var(--muted);font-family:monospace}
#outputBadge{display:none;margin-top:10px;padding:9px 12px;border-radius:7px;background:rgba(16,185,129,.1);border:1px solid var(--green);font-size:.76rem;color:var(--green)}

/* LOG */
.log-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
#log{height:170px;overflow-y:auto;font-family:'Consolas',monospace;font-size:.74rem;line-height:1.65;color:var(--muted)}
.ll{padding:1px 0}.ll.info{color:var(--cyan)}.ll.stage-log{color:var(--purple);font-weight:700}
.ll.seg-remove{color:var(--red)}.ll.seg-keep{color:var(--green)}.ll.done{color:var(--green);font-weight:700}
.ll.err{color:var(--red);font-weight:700}.ll.start{color:var(--amber);font-weight:700}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<header>
  <span style="font-size:1.4rem">🎙️</span>
  <h1>Karaoke Pipeline</h1>
  <span id="hdrStatus" style="font-size:.74rem;color:var(--muted);margin-left:6px">Idle</span>
  <div class="dot" id="dot"></div>
</header>

<div class="layout">

  <!-- LEFT -->
  <div class="left">
    <div class="card">
      <div class="card-title">Controls</div>
      <div class="field">
        <label>Song</label>
        <select id="songSel"><option value="">Loading…</option></select>
      </div>
      <div class="field">
        <label>Remove Voice</label>
        <div class="tog">
          <button class="tog-btn on" data-v="male"   onclick="setGender('male')">♂ Male</button>
          <button class="tog-btn female" data-v="female" onclick="setGender('female')">♀ Female</button>
        </div>
      </div>
      <button id="runBtn" onclick="run()">▶ Run Pipeline</button>
    </div>

    <div class="card">
      <div class="card-title">Stages</div>
      <div class="stages">
        <div class="stage" id="st-demucs">  <span class="stage-ico">🎼</span>Stem Separation</div>
        <div class="stage" id="st-gender">  <span class="stage-ico">🔍</span>Gender Detection</div>
        <div class="stage" id="st-suppress"><span class="stage-ico">🔇</span>Suppress Segments</div>
        <div class="stage" id="st-mix">     <span class="stage-ico">🎚️</span>Mix & Export</div>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">

    <!-- STEM TRACKS -->
    <div class="tracks-card">
      <div class="tracks-title">Stem Tracks</div>
      <div class="legend">
        <div class="leg-item"><div class="leg-dot" style="background:rgba(239,68,68,.55)"></div>Removing</div>
        <div class="leg-item"><div class="leg-dot" style="background:rgba(16,185,129,.35)"></div>Keeping</div>
        <div class="leg-item"><div class="leg-dot" style="background:rgba(255,255,255,.07)"></div>No vocals</div>
      </div>

      <div id="trackList">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- OUTPUT PLAYER -->
    <div class="player-card">
      <div class="player-title">Output Waveform</div>
      <canvas id="outputCanvas"></canvas>
      <div class="player-controls">
        <button class="p-btn" id="playBtn" disabled onclick="togglePlay()">▶ Play</button>
        <button class="p-btn" id="stopBtn" disabled onclick="stopAudio()">■ Stop</button>
        <span id="timer">0:00 / 0:00</span>
      </div>
      <div id="outputBadge"></div>
    </div>

    <!-- LOG -->
    <div class="log-card">
      <div class="card-title">Pipeline Log</div>
      <div id="log"></div>
    </div>

  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
const STEMS = ["vocals","drums","bass","guitar","piano","other"];
const STEM_COLORS = {
  vocals:"#06b6d4", drums:"#f59e0b", bass:"#7c3aed",
  guitar:"#10b981",  piano:"#ec4899",  other:"#94a3b8"
};

// ── State ─────────────────────────────────────────────────────────────────
let removeGender = "male";
let stemData     = {};   // stem -> {peaks, duration, path}
let segments     = [];
let audioCtx     = null;
let audioSource  = null;
let audioBuffer  = null;
let startedAt    = 0;
let pausedAt     = 0;
let isPlaying    = false;
let timerInterval= null;
let outputPath   = null;

// ── Build stem track rows ─────────────────────────────────────────────────
function buildTracks() {
  const list = document.getElementById("trackList");
  list.innerHTML = "";
  STEMS.forEach(stem => {
    const row = document.createElement("div");
    row.className = "track";
    row.id = "track-" + stem;
    row.innerHTML = `
      <div class="track-label ${stem}">${stem}</div>
      <div class="track-canvas-wrap">
        <canvas class="track-canvas" id="cv-${stem}"></canvas>
        <div class="track-placeholder" id="ph-${stem}">waiting…</div>
      </div>`;
    list.appendChild(row);
  });
}

// ── Draw waveform on canvas ───────────────────────────────────────────────
function drawWave(canvasId, peaks, duration, segs, stemName) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const wrap  = canvas.parentElement;
  canvas.width  = wrap.offsetWidth  || 600;
  canvas.height = wrap.offsetHeight || 54;
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Draw segment regions (only on vocals)
  if (stemName === "vocals" && segs && segs.length && duration > 0) {
    segs.forEach(sg => {
      const x1 = (sg.start / duration) * W;
      const x2 = (sg.end   / duration) * W;
      ctx.fillStyle = sg.remove
        ? "rgba(239,68,68,0.28)"
        : "rgba(16,185,129,0.15)";
      ctx.fillRect(x1, 0, x2 - x1, H);
    });
  } else if (stemName !== "vocals") {
    ctx.fillStyle = "rgba(255,255,255,0.04)";
    ctx.fillRect(0, 0, W, H);
  }

  // Draw waveform
  const color = STEM_COLORS[stemName] || "#94a3b8";
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.2;
  ctx.globalAlpha = 0.85;

  const mid = H / 2;
  const maxP = Math.max(...peaks, 0.001);
  ctx.beginPath();
  peaks.forEach((p, i) => {
    const x = (i / peaks.length) * W;
    const h = (p / maxP) * mid * 0.9;
    ctx.moveTo(x, mid - h);
    ctx.lineTo(x, mid + h);
  });
  ctx.stroke();
  ctx.globalAlpha = 1;

  document.getElementById("ph-" + stemName).style.display = "none";
}

// ── Load stem waveform from server ────────────────────────────────────────
async function loadStemWave(stemName, path) {
  try {
    const res = await fetch(`/waveform?path=${encodeURIComponent(path)}&points=700`);
    const data = await res.json();
    if (data.error) return;
    stemData[stemName] = {peaks: data.peaks, duration: data.duration, path};
    drawWave("cv-" + stemName, data.peaks, data.duration, segments, stemName);
  } catch(e) { console.warn("waveform load failed", stemName, e); }
}

// ── Redraw vocals with latest segments ───────────────────────────────────
function redrawVocals() {
  const d = stemData["vocals"];
  if (!d) return;
  drawWave("cv-vocals", d.peaks, d.duration, segments, "vocals");
}

// ── Output canvas ─────────────────────────────────────────────────────────
function drawOutputWave(peaks, duration) {
  const canvas = document.getElementById("outputCanvas");
  canvas.width  = canvas.offsetWidth  || 600;
  canvas.height = 60;
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  const maxP = Math.max(...peaks, 0.001);
  const grad = ctx.createLinearGradient(0,0,W,0);
  grad.addColorStop(0, "#7c3aed");
  grad.addColorStop(1, "#06b6d4");
  ctx.strokeStyle = grad;
  ctx.lineWidth = 1.2;
  const mid = H/2;
  ctx.beginPath();
  peaks.forEach((p,i) => {
    const x = (i/peaks.length)*W;
    const h = (p/maxP)*mid*0.88;
    ctx.moveTo(x, mid-h);
    ctx.lineTo(x, mid+h);
  });
  ctx.stroke();
}

// ── Audio player ──────────────────────────────────────────────────────────
async function loadOutput(path) {
  outputPath = path;
  audioCtx   = new AudioContext();
  const res  = await fetch(`/file?path=${encodeURIComponent(path)}`);
  const buf  = await res.arrayBuffer();
  audioBuffer = await audioCtx.decodeAudioData(buf);
  document.getElementById("playBtn").disabled = false;
  document.getElementById("stopBtn").disabled = false;
  updateTimer();
  // Draw from decoded buffer
  const data  = audioBuffer.getChannelData(0);
  const pts   = 800;
  const step  = Math.max(1, Math.floor(data.length / pts));
  const peaks = [];
  for (let i = 0; i < pts; i++) {
    let max = 0;
    for (let j = i*step; j < Math.min((i+1)*step, data.length); j++)
      max = Math.max(max, Math.abs(data[j]));
    peaks.push(max);
  }
  drawOutputWave(peaks, audioBuffer.duration);
}

function togglePlay() {
  if (!audioBuffer) return;
  if (isPlaying) {
    pausedAt = audioCtx.currentTime - startedAt;
    audioSource.stop();
    isPlaying = false;
    document.getElementById("playBtn").textContent = "▶ Play";
    clearInterval(timerInterval);
  } else {
    audioSource = audioCtx.createBufferSource();
    audioSource.buffer = audioBuffer;
    audioSource.connect(audioCtx.destination);
    audioSource.start(0, pausedAt);
    startedAt = audioCtx.currentTime - pausedAt;
    isPlaying = true;
    document.getElementById("playBtn").textContent = "⏸ Pause";
    timerInterval = setInterval(updateTimer, 250);
    audioSource.onended = () => {
      isPlaying = false;
      pausedAt  = 0;
      document.getElementById("playBtn").textContent = "▶ Play";
      clearInterval(timerInterval);
      updateTimer();
    };
  }
}

function stopAudio() {
  if (audioSource && isPlaying) audioSource.stop();
  isPlaying = false; pausedAt = 0;
  document.getElementById("playBtn").textContent = "▶ Play";
  clearInterval(timerInterval);
  updateTimer();
}

function updateTimer() {
  if (!audioBuffer) return;
  const cur = isPlaying ? audioCtx.currentTime - startedAt : pausedAt;
  document.getElementById("timer").textContent =
    fmt(Math.min(cur, audioBuffer.duration)) + " / " + fmt(audioBuffer.duration);
}

function fmt(s) {
  const m = Math.floor(s/60);
  return m + ":" + String(Math.floor(s%60)).padStart(2,"0");
}

// ── Stage helpers ─────────────────────────────────────────────────────────
function setStage(id, cls) {
  const el = document.getElementById("st-" + id);
  if (el) el.className = "stage " + cls;
}
function resetStages() {
  ["demucs","gender","suppress","mix"].forEach(s => setStage(s,""));
}

// ── Log ───────────────────────────────────────────────────────────────────
function logLine(text, cls="") {
  const log  = document.getElementById("log");
  const div  = document.createElement("div");
  div.className = "ll " + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// ── Gender toggle ─────────────────────────────────────────────────────────
function setGender(v) {
  removeGender = v;
  document.querySelectorAll(".tog-btn").forEach(b =>
    b.classList.toggle("on", b.dataset.v === v));
}

// ── Song loader ───────────────────────────────────────────────────────────
async function loadSongs() {
  const res  = await fetch("/songs");
  const data = await res.json();
  const sel  = document.getElementById("songSel");
  sel.innerHTML = "";
  data.songs.forEach(s => {
    const o = document.createElement("option");
    o.value = s.path; o.textContent = s.name;
    sel.appendChild(o);
  });
}

// ── Main run ──────────────────────────────────────────────────────────────
async function run() {
  const inputPath = document.getElementById("songSel").value;
  if (!inputPath) { alert("Select a song first."); return; }

  // Reset
  segments = {};
  stemData = {};
  buildTracks();
  document.getElementById("log").innerHTML = "";
  document.getElementById("outputBadge").style.display = "none";
  document.getElementById("playBtn").disabled = true;
  document.getElementById("stopBtn").disabled = true;
  document.getElementById("runBtn").disabled = true;
  document.getElementById("dot").classList.add("on");
  document.getElementById("hdrStatus").textContent = "Processing…";
  resetStages();
  segments = [];

  const res = await fetch("/process", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({input_path: inputPath, remove: removeGender})
  });

  const reader  = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream:true});
    const parts = buffer.split("\n\n");
    buffer = parts.pop();
    for (const part of parts) {
      if (!part.startsWith("data: ")) continue;
      try { handleEvent(JSON.parse(part.slice(6))); } catch {}
    }
  }

  document.getElementById("runBtn").disabled = false;
  document.getElementById("dot").classList.remove("on");
}

function handleEvent(ev) {
  const t = ev.type;

  if (t === "start") { logLine(ev.message, "start"); return; }
  if (t === "info")  { logLine(ev.message, "info");  return; }
  if (t === "log")   { logLine(ev.message); return; }
  if (t === "error") {
    logLine(ev.message, "err");
    document.getElementById("hdrStatus").textContent = "Error ✗";
    return;
  }

  if (t === "stage") {
    const {name, status} = ev;
    logLine(ev.message, "stage-log");
    if (status === "start" || status === "loading" || status === "scanning")
      setStage(name, "active");
    if (status === "done" || status === "ready")
      setStage(name, "done");

    // Stems are ready — load waveforms for all
    if (name === "demucs" && status === "done" && ev.stems) {
      Object.entries(ev.stems).forEach(([stem, path]) => {
        loadStemWave(stem, path);
      });
    }
    return;
  }

  if (t === "segment") {
    const seg = {
      start:      ev.start,
      end:        ev.end,
      gender:     ev.gender,
      confidence: ev.confidence,
      remove:     ev.remove,
    };
    segments.push(seg);
    redrawVocals();
    const cls = ev.remove ? "seg-remove" : "seg-keep";
    logLine(ev.message, cls);
    return;
  }

  if (t === "done") {
    logLine(ev.message, "done");
    document.getElementById("hdrStatus").textContent = "Done ✓";
    ["demucs","gender","suppress","mix"].forEach(s => setStage(s,"done"));
    const badge = document.getElementById("outputBadge");
    badge.textContent = "✅ " + ev.output;
    badge.style.display = "block";
    loadOutput(ev.output);
    return;
  }
}

// ── Init ──────────────────────────────────────────────────────────────────
buildTracks();
loadSongs();
</script>
</body>
</html>
